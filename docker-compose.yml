services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loopbill
      POSTGRES_PASSWORD: loopbill
      POSTGRES_DB: loopbill
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopbill"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
